<!doctype html><html><head><meta charset="utf-8"><style>body{font:14px var(--font-sans);color:var(--foreground)}nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}button{font:inherit;padding:7px 12px;background:var(--secondary);color:var(--foreground);border:1px solid var(--border);border-radius:6px;cursor:pointer}button[aria-selected=true]{background:var(--foreground);color:var(--background)}figure{margin:0}img{width:100%;height:auto;border-radius:6px}p{color:var(--muted-foreground);line-height:1.5;margin:10px 0 0}[hidden]{display:none}</style></head><body><nav role="tablist" aria-label="Updated application views"><button role="tab" aria-selected="true" data-view="spectrum">Spectrum</button><button role="tab" aria-selected="false" data-view="outliers">Outliers</button><button role="tab" aria-selected="false" data-view="spectrogram">Spectrogram</button><button role="tab" aria-selected="false" data-view="compact">Compact layout</button></nav><figure id="spectrum"><img src="C:/AI/Audio/Music/FrequencyCleaner/artifacts/ui/spectrum-final.png" alt="Actual updated Spectrum view with stronger active states, presets and separated transport groups"><p>Live frequency levels and editable EQ. Playback, comparison, and loop controls use separate groups with equal-height buttons.</p></figure><figure id="outliers" hidden><img src="C:/AI/Audio/Music/FrequencyCleaner/artifacts/ui/outliers-final.png" alt="Updated Outliers view showing whole-track original and cleaned measurements and the current audio trace"><p>Outliers: track-wide original and cleaned measurements, plus a white trace that follows the current audio. The dashed line marks the detection threshold.</p></figure><figure id="spectrogram" hidden><img src="C:/AI/Audio/Music/FrequencyCleaner/artifacts/ui/spectrogram-final.gif" alt="Animated actual spectrogram with moving playback cursor"><p>Spectrogram: outlier strength across time and frequency. Click to seek, or Shift-drag to choose a loop. Brightness measures strength above the local spectral floor.</p></figure><figure id="compact" hidden><img src="C:/AI/Audio/Music/FrequencyCleaner/artifacts/ui/transport-small-final.png" alt="Actual 1280 by 820 layout with Outliers inspector and docked EQ panel"><p>The compact layout keeps the preset and processing-mode selectors readable and retains the draggable EQ panel.</p></figure><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));document.querySelectorAll('figure').forEach(x=>x.hidden=x.id!==b.dataset.view)});</script></body></html>
